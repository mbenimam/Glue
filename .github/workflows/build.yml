name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libgl1-mesa-dev
      - name: Install premake5
        run: |
          curl -sL https://github.com/premake/premake-core/releases/download/v5.0.0/premake-5.0.0-linux.tar.gz | tar xz
          sudo install -m755 premake5 /usr/local/bin/premake5
      - name: Layering guard (no GL or GLFW outside the backends)
        run: ./scripts/check-layering.sh
      - name: Generate and build
        run: |
          premake5 gmake
          make -C build config=release -j"$(nproc)"
      - name: Unit tests (no GPU needed)
        run: ./bin/Release/tests
